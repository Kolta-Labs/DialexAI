# ==============================================================================
# Nginx Reverse Proxy Configuration for Dialex
# ==============================================================================
# Important: proxy_buffering MUST be off for Server-Sent Events (SSE) to stream
# in real time to Desktop and Mobile clients.
# ==============================================================================

server {
    listen 80;
    server_name debate.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name debate.yourdomain.com;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/debate.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/debate.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Dialex Engine API and SSE Streaming
    location / {
        proxy_pass http://127.0.0.1:7890;
        proxy_http_version 1.1;

        # Disable buffering specifically for SSE turn streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chunked transfer encoding support
        chunked_transfer_encoding on;
    }
}
