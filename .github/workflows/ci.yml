name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kmp-and-desktop:
    name: Kotlin Multiplatform & Desktop Tests
    runs-on: macos-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout KoltLibs Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/KoltLibs
          path: KoltLibs
          token: ${{ secrets.KOLTLIBS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run KMP Common & Desktop Tests
        working-directory: DialexAI
        run: ./gradlew :shared:allTests :desktopApp:compileKotlinJvm --no-daemon --stacktrace

  android-build:
    name: Android Mobile Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout KoltLibs Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/KoltLibs
          path: KoltLibs
          token: ${{ secrets.KOLTLIBS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android Client
        working-directory: DialexAI
        run: ./gradlew :androidApp:compileDebugKotlin :androidApp:assembleDebug --no-daemon

  go-engine:
    name: Go Orchestration Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: engine/go.sum

      - name: Verify Go Modules
        working-directory: engine
        run: |
          go mod download
          go mod verify

      - name: Run Engine Tests with Race Detector
        working-directory: engine
        run: go test -v -race -timeout 5m ./pkg/...
