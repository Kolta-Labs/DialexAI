name: Kritix AI Verification & Release Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'kritix/**'
      - '.github/workflows/kritix.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'kritix/**'
      - '.github/workflows/kritix.yml'

concurrency:
  group: kritix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-verification:
    name: Go Test Suite & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: kritix/go.sum

      - name: Verify Go Modules
        working-directory: kritix
        run: |
          go mod download
          go mod verify

      - name: Static Analysis (go vet)
        working-directory: kritix
        run: go vet ./pkg/... ./cli/... ./cmd/...

      - name: Run Unit Tests with Race Detector & Coverage
        working-directory: kritix
        run: go test -v -race -cover ./pkg/...

      - name: Build Native CLI Binaries
        working-directory: kritix
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/kritix ./cli/main.go
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/kritixd ./cmd/kritixd/main.go
          ./bin/kritix version
          ./bin/kritix help

      - name: Upload CLI Binaries
        uses: actions/upload-artifact@v4
        with:
          name: kritix-binaries-linux
          path: kritix/bin/
          retention-days: 7

  cockpit-kmp-build:
    name: Desktop Cockpit KMP Compilation
    runs-on: macos-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/Kolt
          path: KoltLibs
          token: ${{ secrets.KOLTLIBS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compile Kritix Cockpit Desktop App
        working-directory: DialexAI
        run: ./gradlew :kritix:app:compileKotlinJvm --no-daemon --stacktrace

  adversarial-pr-check:
    name: Adversarial Reviewer PR Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [go-verification]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build Kritix CLI
        working-directory: kritix
        run: go build -o bin/kritix ./cli/main.go

      - name: Run Adversarial Reviewer on PR Diff
        working-directory: kritix
        run: |
          echo "Running Kritix Adversarial Reviewer against base branch ${{ github.base_ref }}..."
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          if [ -s pr.diff ]; then
            ./bin/kritix review || exit 1
          else
            echo "Clean PR diff; review passed."
          fi
